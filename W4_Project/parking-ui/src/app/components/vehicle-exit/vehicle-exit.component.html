<div class="container">
  
  <div class="page-header">
    <div class="title-group">
      <h2 class="page-title" style="border-color: #f44336;">Vehicle Exit</h2>
      <span class="subtitle">Process payment and release slot</span>
    </div>
  </div>

  <div class="d-flex justify-content-center">
    
    <!-- Exit Form -->
    <mat-card class="form-card">
      <h3 style="margin-top: 0; color: #444; margin-bottom: 20px;">Process Exit</h3>

      <div class="error-banner" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon> {{ errorMessage }}
      </div>

      <form (ngSubmit)="onExit()">
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Search Vehicle Number</mat-label>
          <input matInput [(ngModel)]="vNum" name="vNum" required placeholder="Ex. MH-12-AB-1234">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div style="margin-top: 10px;">
          <button mat-raised-button color="warn" class="action-btn" type="submit" [disabled]="!vNum">
            Calculate Bill & Exit
          </button>
        </div>
      </form>
    </mat-card>

  </div>
</div>
